<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Heart & Cross Shield Background Layer -->
  <g filter="url(#glow)">
    <!-- Heart Outline -->
    <path d="M256 160 C210 100, 120 110, 100 200 C80 270, 160 340, 256 410 C352 340, 432 270, 412 200 C392 110, 302 100, 256 160 Z" 
          fill="rgba(255, 255, 255, 0.08)" 
          stroke="#38bdf8" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Clinical EKG Heartbeat Wave -->
    <path d="M100 270 H180 L210 190 L256 370 L300 200 L330 270 H412" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulsing Center Node Dot -->
    <circle cx="256" cy="370" r="10" fill="#ffffff" />
    <circle cx="210" cy="190" r="8" fill="#38bdf8" />
    <circle cx="300" cy="200" r="8" fill="#38bdf8" />
  </g>
</svg>
