<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none'><path d='M18 10.2C13.8 4.2 6.2 5.2 5 12.8C4 18.6 10.8 24.6 18 30.6C25.2 24.6 32 18.6 31 12.8C29.8 5.2 22.2 4.2 18 10.2Z' stroke='%230d9488' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round' fill='%23f0fdfa'/><path d='M4.5 17.5H11.5L14.2 10.5L18 25L21.8 10.5L24.5 17.5H31.5' stroke='%230d9488' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PulseAI - Intelligent Personal Health Copilot to Understand, Organize, and Manage your healthcare journey with AI-driven report explainers, drug interaction checks, vitals tracking, and emergency care." />
    <title>PulseAI — AI Personal Health Copilot</title>
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PulseAI" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Complete suppression of Google Translate top banner, toolbar & layout shifts */
      .goog-te-banner-frame,
      iframe.goog-te-banner-frame,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      iframe.VIpgJd-ZVi9od-ORHb-OEVmcd,
      body > .skiptranslate,
      body > iframe.skiptranslate,
      iframe.skiptranslate,
      body > iframe[src*="translate.google"],
      body > iframe[src*="translate.googleapis"],
      div.skiptranslate,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        max-height: 0 !important;
        max-width: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        pointer-events: none !important;
        clip: rect(0, 0, 0, 0) !important;
        z-index: -9999 !important;
      }

      html, body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }

      /* Translation Immunity: CSS generated content cannot be translated */
      .lang-static-title::before { content: attr(data-title); display: inline-block; }
      .lang-static-label::before { content: attr(data-label); display: inline-block; font-weight: 700; font-size: 0.85rem; }
      .lang-static-native::before { content: attr(data-native); display: inline-block; font-weight: 500; font-size: 0.78rem; margin-left: 4px; }
    </style>
    <script>
      // Universal React + Translation DOM Protection: Prevents NotFoundError removeChild/insertBefore crashes
      if (typeof Node === 'function' && Node.prototype) {
        const origRemove = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            return child;
          }
          return origRemove.apply(this, arguments);
        };
        const origInsert = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, refNode) {
          if (refNode && refNode.parentNode !== this) {
            return newNode;
          }
          return origInsert.apply(this, arguments);
        };
      }
    </script>
  </head>
  <body>
    <div id="google_translate_element" style="display:none; visibility:hidden; position:absolute; left:-9999px;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,bn,mr,te,ta,gu,pa,kn',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }

      // Proactively suppress any Google Translate banner injection and reset body offset
      (function() {
        function suppressGoogleBanner() {
          if (document.body) {
            if (document.body.style.top && document.body.style.top !== '0px') {
              document.body.style.top = '0px';
            }
            if (document.body.style.position === 'relative') {
              document.body.style.position = 'static';
            }
          }
          if (document.documentElement && document.documentElement.style.top && document.documentElement.style.top !== '0px') {
            document.documentElement.style.top = '0px';
          }
          
          const banners = document.querySelectorAll(
            '.goog-te-banner-frame, iframe.goog-te-banner-frame, .VIpgJd-ZVi9od-ORHb-OEVmcd, iframe.VIpgJd-ZVi9od-ORHb-OEVmcd, body > .skiptranslate, body > iframe.skiptranslate, iframe.skiptranslate, iframe[src*="translate.google"]'
          );
          banners.forEach(function(el) {
            if (el.style.display !== 'none' || el.style.height !== '0px') {
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
              el.style.setProperty('height', '0px', 'important');
              el.style.setProperty('width', '0px', 'important');
              el.style.setProperty('opacity', '0', 'important');
              el.style.setProperty('pointer-events', 'none', 'important');
            }
          });
        }

        setInterval(suppressGoogleBanner, 100);

        if (window.MutationObserver) {
          const obs = new MutationObserver(suppressGoogleBanner);
          obs.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['style', 'class'],
            childList: true,
            subtree: true
          });
        }
      })();
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
